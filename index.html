
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101522">
<meta name="description" content="LiquidOS — une interface moderne pour tablette">
<link rel="manifest" href="./manifest.webmanifest">
<title>LiquidOS</title>

<style>
:root {
  --accent: #83aaff;
  --text: #ffffff;
  --glass: rgba(255,255,255,.12);
  --border: rgba(255,255,255,.19);
  --blur: 18px;
  --brightness: 1;
  --wallpaper: linear-gradient(145deg,#111b36,#4c477d 52%,#171e39);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: system-ui, -apple-system, sans-serif;
  color: var(--text);
  background: #101522;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

button, input, textarea {
  font: inherit;
}

button { color: inherit; cursor: pointer; }

#wallpaper {
  position: fixed;
  inset: 0;
  z-index: -2;
  background: var(--wallpaper);
  filter: brightness(var(--brightness));
  transition: background .3s, filter .2s;
}

#wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse at 15% 20%,rgba(123,160,255,.24),transparent 45%),
    radial-gradient(ellipse at 85% 75%,rgba(204,126,255,.22),transparent 48%);
}

.glass {
  background: var(--glass);
  border: 1px solid var(--border);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: 0 12px 35px rgba(0,0,0,.13);
}

#status {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  display: flex;
  justify-content: space-between;
  padding: max(9px, env(safe-area-inset-top)) 18px 8px;
  font-size: 12px;
  pointer-events: none;
  text-shadow: 0 1px 5px #0005;
}

#lock {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 35px 20px;
  text-align: center;
  background: linear-gradient(160deg,#101a35aa,#17182dbb);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: opacity .25s, visibility .25s;
}

#lock.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.lock-clock {
  font-size: clamp(60px,12vw,100px);
  font-weight: 250;
  letter-spacing: -5px;
  line-height: 1.1;
}

#lockDate {
  margin: 12px 0 50px;
  opacity: .8;
}

.primary {
  border: 0;
  border-radius: 18px;
  padding: 13px 24px;
  background: var(--accent);
  color: #11182b;
  font-weight: 700;
}

#home {
  max-width: 900px;
  margin: 0 auto;
  padding: 62px 20px 120px;
}

.greeting {
  margin: 15px 0 4px;
  font-size: clamp(27px,5vw,40px);
  font-weight: 650;
  letter-spacing: -1.4px;
}

.subtitle { opacity: .7; font-size: 14px; }

.search {
  display: flex;
  gap: 10px;
  margin: 25px 0;
  padding: 13px 16px;
  border-radius: 18px;
}

.search input {
  width: 100%;
  color: var(--text);
  background: transparent;
  border: 0;
  outline: 0;
}

.search input::placeholder { color: #ffffff9c; }

.section-title {
  font-size: 13px;
  font-weight: 700;
  opacity: .75;
  margin: 25px 0 16px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.apps {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: 24px 12px;
}

.app {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--text);
}

.app-icon {
  width: clamp(58px,10vw,76px);
  height: clamp(58px,10vw,76px);
  display: grid;
  place-items: center;
  border-radius: 23px;
  font-size: 31px;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.2);
  box-shadow: 0 8px 22px #0002;
  transition: transform .15s;
}

.app:active .app-icon { transform: scale(.91); }

.app-name {
  font-size: 12px;
  text-align: center;
  overflow-wrap: anywhere;
}

.app-minecraft { background: linear-gradient(140deg,#65ad68,#295e43); }
.app-spotify { background: #1db954; color: #102a1a; }
.app-snapchat { background: #ffe500; color: #222; }
.app-youtube { background: #ff3040; }
.app-facebook { background: #1877f2; }
.app-instagram {
  background: linear-gradient(135deg,#7b35c9,#e83d83,#ffae53);
}

.widget {
  border-radius: 24px;
  padding: 19px;
  margin-top: 28px;
}

.widget h3 { margin: 0 0 8px; font-size: 16px; }
.widget p { margin: 0; opacity: .75; font-size: 13px; }

#dock {
  position: fixed;
  bottom: max(12px,env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 15px;
  border-radius: 24px;
  max-width: calc(100% - 24px);
}

.dock-button {
  border: 0;
  background: transparent;
  border-radius: 14px;
  padding: 8px;
  font-size: 22px;
}

.dock-button:active { background: #ffffff20; }

.panel {
  position: fixed;
  top: 48px;
  right: 12px;
  width: min(370px,calc(100vw - 24px));
  max-height: calc(100dvh - 85px);
  overflow: auto;
  z-index: 40;
  padding: 18px;
  border-radius: 25px;
}

.hidden { display: none !important; }

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.panel-header h2 { margin: 0; font-size: 20px; }

.icon-button {
  border: 0;
  border-radius: 12px;
  padding: 9px 12px;
  background: #ffffff17;
}

.quick-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}

.quick {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 10px;
  background: #ffffff0c;
  text-align: left;
}

.quick.active {
  color: #121a2a;
  background: var(--accent);
}

.setting {
  padding: 14px 0;
  border-bottom: 1px solid #ffffff20;
}

.setting label {
  display: block;
  font-size: 14px;
  margin-bottom: 9px;
}

.setting input[type="range"] { width: 100%; }
.setting select, .setting input[type="color"] { max-width: 100%; }

.field, .editor {
  width: 100%;
  border: 1px solid var(--border);
  background: #10152288;
  color: var(--text);
  border-radius: 12px;
  padding: 11px;
  outline-color: var(--accent);
}

.editor { min-height: 180px; resize: vertical; }

.action {
  border: 1px solid var(--border);
  border-radius: 13px;
  padding: 11px 14px;
  background: #ffffff13;
  color: var(--text);
  margin: 4px 2px 4px 0;
}

.window {
  position: fixed;
  inset: 50px 12px 95px;
  z-index: 30;
  overflow: auto;
  padding: 20px;
  border-radius: 26px;
}

.window h2 { margin-top: 0; }
.window-content { max-width: 650px; margin: auto; }

.calculator {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 8px;
  margin-top: 16px;
}

.calculator button {
  min-height: 53px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: #ffffff12;
  font-size: 18px;
}

#calcDisplay {
  width: 100%;
  text-align: right;
  font-size: 28px;
}

#toast {
  position: fixed;
  z-index: 100;
  bottom: 100px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 18px;
  background: #101522ed;
  border: 1px solid var(--border);
  border-radius: 15px;
  max-width: calc(100vw - 30px);
  text-align: center;
  font-size: 13px;
}

body.light {
  --text: #20283b;
  --glass: rgba(255,255,255,.56);
  --border: rgba(35,45,70,.16);
  --wallpaper: linear-gradient(140deg,#c3dcff,#d9cafa,#f6e9f8);
}

body.light #status { text-shadow: none; }
body.light .field, body.light .editor { background: #ffffffa8; }
body.light .search input { color: var(--text); }
body.light .search input::placeholder { color: #20283b99; }

@media (min-width:650px) {
  .apps { grid-template-columns: repeat(6,minmax(0,1fr)); }
  #home { padding-top: 75px; }
  .window { inset: 60px 10% 90px; }
}

@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition: none !important;
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<div id="wallpaper"></div>

<div id="status">
  <span id="statusTime">12:00</span>
  <span>LiquidOS　● Wi-Fi　▰</span>
</div>

<section id="lock">
  <div class="lock-clock" id="lockTime">12:00</div>
  <div id="lockDate">Bienvenue sur LiquidOS</div>
  <div style="font-size:34px;margin-bottom:18px">◉</div>
  <p>Votre tablette, votre espace.</p>
  <button class="primary" id="unlock">Déverrouiller →</button>
  <p style="font-size:12px;opacity:.6;margin-top:24px">LiquidOS · Interface expérimentale</p>
</section>

<main id="home" class="hidden">
  <h1 class="greeting">Bonjour 👋</h1>
  <div class="subtitle" id="homeDate">Bienvenue sur LiquidOS</div>

  <form id="searchForm" class="search glass">
    <span>⌕</span>
    <input id="searchInput" placeholder="Rechercher sur Internet…" autocomplete="off">
    <button class="icon-button" type="submit">↗</button>
  </form>

  <div class="section-title">Mes applications</div>
  <div class="apps" id="appsGrid">
    <button class="app" data-app="minecraft">
      <span class="app-icon app-minecraft">⛏️</span>
      <span class="app-name">Minecraft</span>
    </button>
    <button class="app" data-app="spotify">
      <span class="app-icon app-spotify">♫</span>
      <span class="app-name">Spotify</span>
    </button>
    <button class="app" data-app="snapchat">
      <span class="app-icon app-snapchat">👻</span>
      <span class="app-name">Snapchat</span>
    </button>
    <button class="app" data-app="youtube">
      <span class="app-icon app-youtube">▶</span>
      <span class="app-name">YouTube</span>
    </button>
    <button class="app" data-app="facebook">
      <span class="app-icon app-facebook">f</span>
      <span class="app-name">Facebook</span>
    </button>
    <button class="app" data-app="instagram">
      <span class="app-icon app-instagram">◎</span>
      <span class="app-name">Instagram</span>
    </button>
    <button class="app" data-app="notes">
      <span class="app-icon">📝</span>
      <span class="app-name">Notes</span>
    </button>
    <button class="app" data-app="calculator">
      <span class="app-icon">🧮</span>
      <span class="app-name">Calculatrice</span>
    </button>
    <button class="app" data-app="calendar">
      <span class="app-icon">📅</span>
      <span class="app-name">Calendrier</span>
    </button>
    <button class="app" data-app="files">
      <span class="app-icon">📁</span>
      <span class="app-name">Fichiers</span>
    </button>
    <button class="app" data-app="settings">
      <span class="app-icon">⚙️</span>
      <span class="app-name">Paramètres</span>
    </button>
    <button class="app" data-app="about">
      <span class="app-icon">◉</span>
      <span class="app-name">À propos</span>
    </button>
  </div>

  <section class="widget glass">
    <h3>◉ LiquidOS</h3>
    <p>Un espace simple, personnalisable et conçu pour ta tablette.</p>
  </section>
</main>

<nav id="dock" class="glass hidden" aria-label="Barre d'applications">
  <button class="dock-button" data-action="home" title="Accueil">⌂</button>
  <button class="dock-button" data-action="notes" title="Notes">📝</button>
  <button class="dock-button" data-action="quick" title="Centre de contrôle">☷</button>
  <button class="dock-button" data-action="settings" title="Paramètres">⚙</button>
  <button class="dock-button" data-action="lock" title="Verrouiller">🔒</button>
</nav>

<section id="quickPanel" class="panel glass hidden">
  <div class="panel-header">
    <h2>Centre de contrôle</h2>
    <button class="icon-button" data-action="close-panels">✕</button>
  </div>
  <div class="quick-grid">
    <button class="quick active" data-toggle="wifi">◉ Wi-Fi<br><small>Affichage simulé</small></button>
    <button class="quick" data-toggle="bluetooth">ᛒ Bluetooth<br><small>Affichage simulé</small></button>
    <button class="quick active" data-toggle="sound">♫ Son</button>
    <button class="quick" data-action="settings">⚙ Paramètres</button>
    <button class="quick" data-action="lock">🔒 Verrouiller</button>
    <button class="quick" data-action="home">⌂ Accueil</button>
  </div>
  <div class="setting">
    <label for="brightness">Luminosité visuelle</label>
    <input id="brightness" type="range" min="35" max="100" value="100">
  </div>
</section>

<section id="settingsPanel" class="panel glass hidden">
  <div class="panel-header">
    <h2>Paramètres</h2>
    <button class="icon-button" data-action="close-panels">✕</button>
  </div>

  <div class="setting">
    <label for="theme">Thème</label>
    <select id="theme" class="field">
      <option value="dark">Sombre</option>
      <option value="light">Clair</option>
    </select>
  </div>

  <div class="setting">
    <label for="wallpaperChoice">Fond d'écran</label>
    <select id="wallpaperChoice" class="field">
      <option value="blue">Océan bleu</option>
      <option value="purple">Violet</option>
      <option value="green">Forêt</option>
      <option value="black">Nuit noire</option>
    </select>
  </div>

  <div class="setting">
    <label for="accent">Couleur principale</label>
    <input id="accent" type="color" value="#83aaff">
  </div>

  <div class="setting">
    <label for="textSize">Taille du texte</label>
    <select id="textSize" class="field">
      <option value="14">Petite</option>
      <option value="16" selected>Normale</option>
      <option value="18">Grande</option>
      <option value="20">Très grande</option>
    </select>
  </div>

  <button class="action" data-action="lock">🔒 Verrouiller LiquidOS</button>
  <button class="action" data-action="about">ℹ️ À propos</button>
</section>

<section id="appWindow" class="window glass hidden">
  <div class="panel-header">
    <h2 id="windowTitle">Application</h2>
    <button class="icon-button" data-action="close-window">✕</button>
  </div>
  <div id="windowContent" class="window-content"></div>
</section>

<div id="toast" class="hidden" role="status"></div>

<script>
"use strict";

const $ = (selector) => document.querySelector(selector);
const $$ = (selector) => [...document.querySelectorAll(selector)];

const lockScreen = $("#lock");
const homeScreen = $("#home");
const dock = $("#dock");
const quickPanel = $("#quickPanel");
const settingsPanel = $("#settingsPanel");
const appWindow = $("#appWindow");
const windowTitle = $("#windowTitle");
const windowContent = $("#windowContent");
const toast = $("#toast");

const appUrls = {
  minecraft: "https://classic.minecraft.net/",
  spotify: "https://open.spotify.com/",
  snapchat: "https://web.snapchat.com/",
  youtube: "https://www.youtube.com/",
  facebook: "https://www.facebook.com/",
  instagram: "https://www.instagram.com/"
};

let toastTimeout;
let calcExpression = "";
let selectedFileUrl = null;

function showToast(message) {
  toast.textContent = message;
  toast.classList.remove("hidden");
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.add("hidden"), 2400);
}

function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString("fr-FR", {
    hour: "2-digit",
    minute: "2-digit"
  });
  $("#lockTime").textContent = time;
  $("#statusTime").textContent = time;
  $("#lockDate").textContent = now.toLocaleDateString("fr-FR", {
    weekday: "long", day: "numeric", month: "long"
  });
  $("#homeDate").textContent = now.toLocaleDateString("fr-FR", {
    weekday: "long", day: "numeric", month: "long"
  });
}

function unlockDevice() {
  lockScreen.classList.add("hidden");
  homeScreen.classList.remove("hidden");
  dock.classList.remove("hidden");
  closePanels();
}

function lockDevice() {
  closePanels();
  closeWindow();
  lockScreen.classList.remove("hidden");
  homeScreen.classList.add("hidden");
  dock.classList.add("hidden");
}

function closePanels() {
  quickPanel.classList.add("hidden");
  settingsPanel.classList.add("hidden");
}

function closeWindow() {
  appWindow.classList.add("hidden");
  windowContent.replaceChildren();
  if (selectedFileUrl) {
    URL.revokeObjectURL(selectedFileUrl);
    selectedFileUrl = null;
  }
}

function openPanel(panel) {
  closePanels();
  closeWindow();
  panel.classList.remove("hidden");
}

function openWindow(title, content) {
  closePanels();
  windowTitle.textContent = title;
  windowContent.replaceChildren();
  if (typeof content === "string") {
    windowContent.innerHTML = content;
  } else {
    windowContent.append(content);
  }
  appWindow.classList.remove("hidden");
}

function openExternal(url, name) {
  const opened = window.open(url, "_blank", "noopener,noreferrer");
  if (!opened) {
    showToast("Ouverture bloquée. Autorise les fenêtres ou utilise le lien dans l'application.");
  } else {
    showToast("Ouverture de " + name);
  }
}

function openNotes() {
  const wrap = document.createElement("div");
  const info = document.createElement("p");
  info.textContent = "Tes notes sont enregistrées sur cet appareil.";
  const editor = document.createElement("textarea");
  editor.className = "editor";
  editor.placeholder = "Écris tes notes ici…";
  editor.value = localStorage.getItem("liquidos-notes") || "";
  editor.setAttribute("aria-label", "Contenu des notes");

  const save = document.createElement("button");
  save.className = "primary";
  save.textContent = "Enregistrer";
  save.onclick = () => {
    try {
      localStorage.setItem("liquidos-notes", editor.value);
      showToast("Notes enregistrées");
    } catch {
      showToast("Impossible d'enregistrer les notes");
    }
  };

  wrap.append(info, editor, document.createElement("br"), save);
  openWindow("📝 Notes", wrap);
}

function openCalculator() {
  calcExpression = "";
  const wrap = document.createElement("div");
  const display = document.createElement("input");
  display.id = "calcDisplay";
  display.className = "field";
  display.readOnly = true;
  display.placeholder = "0";
  display.setAttribute("aria-label", "Affichage de la calculatrice");
  wrap.append(display);

  const grid = document.createElement("div");
  grid.className = "calculator";

  ["7","8","9","÷","4","5","6","×","1","2","3","−","C","0",".","+","(",")","⌫","="].forEach(key => {
    const button = document.createElement("button");
    button.textContent = key;
    button.onclick = () => {
      if (key === "C") {
        calcExpression = "";
      } else if (key === "⌫") {
        calcExpression = calcExpression.slice(0,-1);
      } else if (key === "=") {
        calculate();
      } else {
        const mapped = {"÷":"/","×":"*","−":"-"};
        calcExpression += mapped[key] || key;
      }
      display.value = calcExpression;
    };
    grid.append(button);
  });

  function calculate() {
    if (!calcExpression || !/^[0-9+\-*/().\s]+$/.test(calcExpression)) {
      showToast("Calcul invalide");
      return;
    }
    try {
      const result = Function('"use strict"; return (' + calcExpression + ')')();
      if (!Number.isFinite(result)) throw new Error("Résultat invalide");
      calcExpression = String(Math.round((result + Number.EPSILON) * 1e10) / 1e10);
    } catch {
      calcExpression = "";
      showToast("Calcul impossible");
    }
    display.value = calcExpression;
  }

  wrap.append(grid);
  openWindow("🧮 Calculatrice", wrap);
}

function openCalendar() {
  const now = new Date();
  const wrap = document.createElement("div");
  const heading = document.createElement("h3");
  heading.textContent = now.toLocaleDateString("fr-FR", {
    month: "long", year: "numeric"
  });
  const date = document.createElement("div");
  date.style.fontSize = "64px";
  date.style.fontWeight = "250";
  date.textContent = now.getDate();
  const detail = document.createElement("p");
  detail.textContent = now.toLocaleDateString("fr-FR", {
    weekday: "long", day: "numeric", month: "long", year: "numeric"
  });
  const reminder = document.createElement("textarea");
  reminder.className = "editor";
  reminder.style.minHeight = "100px";
  reminder.placeholder = "Rappels personnels…";
  reminder.value = localStorage.getItem("liquidos-calendar-note") || "";
  const save = document.createElement("button");
  save.className = "primary";
  save.textContent = "Enregistrer le rappel";
  save.onclick = () => {
    localStorage.setItem("liquidos-calendar-note", reminder.value);
    showToast("Rappel enregistré");
  };
  wrap.append(heading, date, detail, reminder, save);
  openWindow("📅 Calendrier", wrap);
}

function openFiles() {
  const wrap = document.createElement("div");
  const info = document.createElement("p");
  info.textContent = "Choisis un fichier sur ta tablette pour l'ouvrir. L'accès est limité aux fichiers que tu sélectionnes.";
  const input = document.createElement("input");
  input.type = "file";
  input.className = "field";
  input.accept = "*/*";
  const output = document.createElement("div");
  output.style.marginTop = "15px";

  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    output.replaceChildren();
    const name = document.createElement("p");
    name.textContent = file.name + " — " + Math.ceil(file.size / 1024) + " Ko";
    output.append(name);

    if (file.type.startsWith("image/")) {
      const image = document.createElement("img");
      selectedFileUrl = URL.createObjectURL(file);
      image.src = selectedFileUrl;
      image.alt = file.name;
      image.style.maxWidth = "100%";
      image.style.borderRadius = "14px";
      output.append(image);
    } else if (file.type.startsWith("audio/") || file.type.startsWith("video/")) {
      const media = document.createElement(file.type.startsWith("audio/") ? "audio" : "video");
      selectedFileUrl = URL.createObjectURL(file);
      media.src = selectedFileUrl;
      media.controls = true;
      media.style.width = "100%";
      output.append(media);
    } else if (file.type.startsWith("text/")) {
      const reader = new FileReader();
      reader.onload = () => {
        const pre = document.createElement("pre");
        pre.style.whiteSpace = "pre-wrap";
        pre.textContent = String(reader.result).slice(0, 20000);
        output.append(pre);
      };
      reader.readAsText(file);
    } else {
      const note = document.createElement("p");
      note.textContent = "Aperçu non disponible pour ce type de fichier.";
      output.append(note);
    }
  };

  wrap.append(info, input, output);
  openWindow("📁 Fichiers", wrap);
}

function openAbout() {
  openWindow("◉ À propos de LiquidOS", `
    <h3>LiquidOS</h3>
    <p>Version 0.8 — prototype web</p>
    <p>Interface expérimentale conçue pour une tablette Android.</p>
    <p>Cette interface ne remplace pas Android et ne contrôle pas directement le matériel.</p>
    <p>Les commandes Wi-Fi, Bluetooth et luminosité présentées ici sont visuelles, sauf intégration native supplémentaire.</p>
  `);
}

function launchApp(name) {
  if (appUrls[name]) {
    openExternal(appUrls[name], name);
    return;
  }
  switch (name) {
    case "notes": openNotes(); break;
    case "calculator": openCalculator(); break;
    case "calendar": openCalendar(); break;
    case "files": openFiles(); break;
    case "settings": openPanel(settingsPanel); break;
    case "about": openAbout(); break;
  }
}

$("#unlock").addEventListener("click", unlockDevice);
lockScreen.addEventListener("click", event => {
  if (event.target === lockScreen) unlockDevice();
});

$$("[data-app]").forEach(button => {
  button.addEventListener("click", () => launchApp(button.dataset.app));
});

$$("[data-action]").forEach(button => {
  button.addEventListener("click", () => {
    const action = button.dataset.action;
    switch (action) {
      case "home":
        closePanels();
        closeWindow();
        showToast("Accueil");
        break;
      case "lock": lockDevice(); break;
      case "quick": openPanel(quickPanel); break;
      case "settings": openPanel(settingsPanel); break;
      case "notes": openNotes(); break;
      case "about": openAbout(); break;
      case "close-panels": closePanels(); break;
      case "close-window": closeWindow(); break;
    }
  });
});

$$("[data-toggle]").forEach(button => {
  button.addEventListener("click", () => {
    button.classList.toggle("active");
    showToast("État visuel modifié — le matériel n'est pas contrôlé");
  });
});

$("#brightness").addEventListener("input", event => {
  document.documentElement.style.setProperty(
    "--brightness",
    String(Number(event.target.value) / 100)
  );
});

const wallpapers = {
  blue: "linear-gradient(145deg,#111b36,#4c477d 52%,#171e39)",
  purple: "linear-gradient(145deg,#291548,#8559a8,#241a40)",
  green: "linear-gradient(145deg,#102d2a,#327e68,#142b3a)",
  black: "linear-gradient(145deg,#050609,#161923,#08090e)"
};

function savePreferences() {
  const preferences = {
    theme: $("#theme").value,
    wallpaper: $("#wallpaperChoice").value,
    accent: $("#accent").value,
    textSize: $("#textSize").value
  };
  try {
    localStorage.setItem("liquidos-preferences", JSON.stringify(preferences));
  } catch {}
}

function applyPreferences(preferences) {
  if (preferences.theme === "light") document.body.classList.add("light");
  else document.body.classList.remove("light");

  const wallpaper = wallpapers[preferences.wallpaper] ? preferences.wallpaper : "blue";
  document.documentElement.style.setProperty("--wallpaper", wallpapers[wallpaper]);
  document.documentElement.style.setProperty("--accent", preferences.accent || "#83aaff");
  document.documentElement.style.fontSize = (preferences.textSize || "16") + "px";

  $("#theme").value = preferences.theme || "dark";
  $("#wallpaperChoice").value = wallpaper;
  $("#accent").value = preferences.accent || "#83aaff";
  $("#textSize").value = preferences.textSize || "16";
}

["theme","wallpaperChoice","accent","textSize"].forEach(id => {
  $("#" + id).addEventListener("change", () => {
    savePreferences();
    try {
      applyPreferences(JSON.parse(localStorage.getItem("liquidos-preferences") || "{}"));
    } catch {}
  });
});

$("#searchForm").addEventListener("submit", event => {
  event.preventDefault();
  const query = $("#searchInput").value.trim();
  if (!query) return;
  openExternal("https://www.google.com/search?q=" + encodeURIComponent(query), "Recherche");
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    closePanels();
    closeWindow();
  }
});

window.addEventListener("error", event => {
  console.error("LiquidOS :", event.message);
});

try {
  const preferences = JSON.parse(localStorage.getItem("liquidos-preferences") || "{}");
  applyPreferences(preferences);
} catch {
  applyPreferences({});
}

updateClock();
setInterval(updateClock, 30000);

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(error => {
      console.warn("Service worker indisponible :", error);
    });
  });
}
</script>
</body>
</html>
