
name: Build LiquidOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile LiquidOS
    runs-on: ubuntu-24.04

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Vérifier les fichiers Android
        run: |
          echo "=== Fichiers du projet ==="
          find app -maxdepth 6 -type f -print
          echo "=== Manifeste Android ==="
          cat app/src/main/AndroidManifest.xml
          echo "=== Configuration application ==="
          cat app/build.gradle
          echo "=== Configuration racine ==="
          cat build.gradle
          cat settings.gradle

      - name: Vérifier la configuration Gradle
        run: gradle tasks --stacktrace

      - name: Compiler LiquidOS
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Vérifier le fichier APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidOS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
